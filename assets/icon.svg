<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E3F2FD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- 搜索图标 -->
  <circle cx="220" cy="200" r="80" fill="none" stroke="url(#icon)" stroke-width="24"/>
  <line x1="278" y1="258" x2="360" y2="340" stroke="url(#icon)" stroke-width="24" stroke-linecap="round"/>

  <!-- 评论气泡 -->
  <path d="M 140 300 Q 140 270 170 270 L 310 270 Q 340 270 340 300 L 340 370 Q 340 400 310 400 L 220 400 L 180 430 L 190 400 L 170 400 Q 140 400 140 370 Z" fill="url(#icon)" opacity="0.9"/>

  <!-- 评论内容线条 -->
  <line x1="180" y1="310" x2="300" y2="310" stroke="#2196F3" stroke-width="16" stroke-linecap="round"/>
  <line x1="180" y1="350" x2="260" y2="350" stroke="#2196F3" stroke-width="16" stroke-linecap="round"/>

  <!-- 数据点装饰 -->
  <circle cx="380" cy="180" r="12" fill="#FF9800"/>
  <circle cx="400" cy="220" r="8" fill="#4CAF50"/>
  <circle cx="360" cy="240" r="10" fill="#F44336"/>
</svg>
